[package]
name = "witnet_toolkit"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
workspace = ".."
description = "CLI and library helpers for building and inspecting Witnet data requests and RAD scripts"

[dependencies]
anyhow = "1.0.98"
hex = "0.4.3"
regex = "1.5.5"
serde_json = "1.0.66"
structopt = "0.3.22"
witnet_data_structures = { path = "../data_structures", default-features = false }
witnet_rad = { path = "../rad", default-features = false }
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread", "macros"] }
thiserror = "2.0.12"
