[package]
name = "witnet_util"
version = "0.3.2"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
workspace = ".."
description = "Shared utilities for timestamps, NTP sync, and secure file storage across Witnet crates"

[dependencies]
